name: Sincronizar Notion e Deploy do Site

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Roda todo dia à meia-noite

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Instalar Dependências
        run: npm install

      - name: 4. Baixar notas do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node sync.js

      - name: 5. Commitar novas notas no repositório
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: atualizando notas do Notion [skip ci]" && git push)

      - name: 6. Build do VitePress
        run: npx vitepress build docs

      - name: 7. Configurar Pages
        uses: actions/configure-pages@v4

      - name: 8. Upload do Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: 9. Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4